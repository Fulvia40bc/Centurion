# As advciv_nt.conf, with DOSBox-X's Nuked-OPL3 core at the chip's native rate (49716 Hz) and the mixer at that rate: for recording the FM music (DRO + WAV) to check the port's OPL renderer (HANDOFF Task 11). PC speaker off.
# DOSBox-X profile for Advanced Civilization (AC_MAIN.EXE, DOS/4GW, Fastgraph 640x480x256 SVGA, AIL SB16 + OPL).
# Runs the run copy C:\work\advciv_run (never the originals, never the reference copy C:\work\advciv_play).
#   dosbox-x.exe -conf C:\work\AdvCiv\tools\dosbox\advciv.conf [-break-start]
# core = normal so the debugger's breakpoints fire; the game's DIG.INI / MDI.INI ask for an SB16 at 220h
# (digital: SB16.DIG; music: SBPRO2.MDI = OPL3 FM).
[sdl]
output     = surface
autolock   = false

[dosbox]
machine    = svga_s3
memsize    = 32
title      = Advanced Civilization
captures   = C:\DOSBox-X\advciv\capture

[cpu]
core       = normal
cputype    = pentium
cycles     = max

[render]
aspect     = false

[sblaster]
sbtype     = sb16
sbbase     = 220
irq        = 7
dma        = 1
hdma       = 5
oplmode    = opl3
oplemu     = nuked
oplrate    = 49716

[mixer]
rate       = 49716

[speaker]
pcspeaker  = false

[autoexec]
mount c C:\work\advciv_run
c:
AC_MAIN.EXE /NT
